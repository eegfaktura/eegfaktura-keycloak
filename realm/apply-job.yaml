# Referenz-Apply-Job: wendet realm/EEGFaktura.yaml deklarativ auf einen
# laufenden Keycloak an (keycloak-config-cli). Als Job, NICHT Init-Container:
# config-cli ist ein Client der KC-Admin-API und braucht einen erreichbaren KC.
#
# Vorbereitung (ConfigMap aus der Realm-YAML erzeugen):
#   kubectl -n <ns> create configmap eegfaktura-realm-config \
#     --from-file=EEGFaktura.yaml=realm/EEGFaktura.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Namespace + Hosts + Admin-Secret sind pro Umgebung zu setzen (Env-Provisioner).
# ⚠️ ERST-CUT — Secret-Namen/-Keys an die reale KC-Admin-Secret-Struktur anpassen.
apiVersion: batch/v1
kind: Job
metadata:
  name: eegfaktura-realm-config-apply
  labels:
    app.kubernetes.io/component: realm-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: realm-config
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-config-cli
          # An die KC-MAJOR pinnen (KC 26 → passende config-cli-Line). Kein :latest.
          image: adorsys/keycloak-config-cli:6.4.0-26.0.4
          env:
            # Ziel-KC: in-cluster Service → im Env-Namespace automatisch das Env-KC.
            - {name: KEYCLOAK_URL, value: "http://eegfaktura-keycloak:8080"}
            - {name: KEYCLOAK_SSLVERIFY, value: "false"}
            # Admin-Credentials aus dem KC-Admin-Secret (least-priv, pro Env).
            - name: KEYCLOAK_USER
              valueFrom: {secretKeyRef: {name: eegfaktura-keycloak, key: KEYCLOAK_ADMIN}}
            - name: KEYCLOAK_PASSWORD
              valueFrom: {secretKeyRef: {name: eegfaktura-keycloak, key: KEYCLOAK_ADMIN_PASSWORD}}
            # Auf KC-Readiness warten (config-cli-eigener Check).
            - {name: KEYCLOAK_AVAILABILITYCHECK_ENABLED, value: "true"}
            - {name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT, value: "120s"}
            # Realm-Quelle + Variablen-Substitution.
            - {name: IMPORT_FILES_LOCATIONS, value: "/config/*.yaml"}
            - {name: IMPORT_VARSUBSTITUTION_ENABLED, value: "true"}
            # Konservativ: keine Löschung nicht-deklarierter Objekte (Prod-Sicherheit).
            - {name: IMPORT_MANAGED_GROUP, value: "no-delete"}
            - {name: IMPORT_MANAGED_CLIENT, value: "no-delete"}
            - {name: IMPORT_MANAGED_ROLE, value: "no-delete"}
            - {name: IMPORT_MANAGED_CLIENT_SCOPE, value: "no-delete"}
            - {name: IMPORT_MANAGED_PROTOCOL_MAPPER, value: "no-delete"}
            # --- Env-spezifische Substitutions-Werte ($(env:...) in der YAML) ---
            - {name: AUTH_URL,      value: "https://$(EEGF_AUTH_HOST)"}
            - {name: CUSTOMER_HOST, value: "$(EEGF_CUSTOMER_HOST)"}
            - {name: ADMIN_HOST,    value: "$(EEGF_ADMIN_HOST)"}
          # Die EEGF_*-Werte setzt der Provisioner pro Env (Dev-Base-Beispiel unten).
          envFrom:
            - configMapRef:
                name: eegfaktura-realm-hosts     # EEGF_AUTH_HOST/CUSTOMER_HOST/ADMIN_HOST
          volumeMounts:
            - {name: realm-config, mountPath: /config, readOnly: true}
      volumes:
        - name: realm-config
          configMap:
            name: eegfaktura-realm-config
---
# Beispiel-Hosts-ConfigMap für die Dev-Base. Pro env/<name> analog mit den
# flachen Wildcard-Hosts (<name>-… .eegfaktura-dev.duckdns.org, ADR-0008).
apiVersion: v1
kind: ConfigMap
metadata:
  name: eegfaktura-realm-hosts
data:
  EEGF_AUTH_HOST: auth.eegfaktura-dev.duckdns.org
  EEGF_CUSTOMER_HOST: eegfaktura-dev.duckdns.org
  EEGF_ADMIN_HOST: admin.eegfaktura-dev.duckdns.org
